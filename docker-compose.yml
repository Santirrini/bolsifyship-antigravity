version: '3.8'

services:
  backend:
    build: ./backend
    container_name: bolsifyshop-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/bolsifyshop
      - ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      - db
    networks:
      - bolsifynet

  frontend:
    build: ./frontend
    container_name: bolsifyshop-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - bolsifynet

  db:
    image: postgres:15-alpine
    container_name: bolsifyshop-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=bolsifyshop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bolsifynet

networks:
  bolsifynet:
    driver: bridge

volumes:
  postgres_data:
